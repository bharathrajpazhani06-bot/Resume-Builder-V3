<script>

try{MODE=localStorage.getItem('rb_mode')=='s'?sessionStorage:localStorage;const a=MODE.getItem('rb_data'),b=MODE.getItem('rb_pii');D=Object.assign(blank(),a?JSON.parse(a):{},b?JSON.parse(b):{})}catch(e){}

}

 else if(t.id=="tpl"){D.tpl=t.value;if(t.value=='sidebar'&&D.accent=='#2563eb'){D.accent='#c8961e';$('#acc').value=D.accent}}else if(t.id=="acc")D.accent=t.value;else if(t.id=='jd'){ats();return}else if(t.id=='fit'){D.fit=t.checked;draw();store();return}else if(t.id=='lg'){tips();return}else if(t.id=='pm'){D.priv=t.checked;store();return}else return;

 const p=$("#paper");p.className="paper "+D.tpl;p.style.setProperty("--a",/^#[0-9a-f]{6}$/i.test(D.accent)?D.accent:"#2563eb");

function validate(){
 const e={};
 if(!D.name.trim())e.name="Name is required";
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(D.email))e.email="Enter a valid email";

 if(!D.summary.trim())e.summary="Summary is required";

 LE=e;document.querySelectorAll("[data-e]").forEach(n=>n.textContent=e[n.dataset.e]||"");
 const k=Object.keys(e);if(k.length){const n=document.querySelector(`[data-e="${k[0]}"]`);n.scrollIntoView({block:"center"})}
 return !k.length;
}
function save(){if(validate()){store();$("#msg").textContent="Saved ✓ all fields valid"}}

 if(!window.html2pdf){alert('PDF library could not load (offline?). Opening print instead.');pr();return}

const NM={summary:'Summary',exp:'Experience',edu:'Education',skills:'Skills',proj:'Projects'};
function stats(h){const t=h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),w=(t.match(/\S+/g)||[]).length;$('#stats').textContent=w+' words · '+t.length+' chars · ~'+Math.max(1,Math.ceil(w/200))+' min read';if(window.crypto&&crypto.subtle)crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(b=>{$('#hash').textContent='SHA-256: '+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}).catch(()=>{})}

function verbs(){const t=' '+[D.summary,...D.proj.map(o=>o.desc||'')].join(' ').toLowerCase().replace(/[^a-z ]/g,' ')+' ';const f=Object.keys(W).filter(k=>t.includes(' '+k+' '));$('#verbs').innerHTML=f.length?'Weak phrases: '+f.map(k=>'<b>'+k+'</b> → '+W[k]).join('; '):''}
function ats0(){const jd=$('#jd').value.toLowerCase(),txt=[D.title,D.summary,...D.skills,...[...D.exp,...D.edu,...D.proj].flatMap(Object.values)].join(' ').toLowerCase();const stop=new Set('the and for with that this are you our will from have has your not but can all any who was were been into their about more than such also may out use used using per etc'.split(' '));const ws=[...new Set((jd.match(/[a-z][a-z+#.]{2,}/g)||[]).filter(w=>!stop.has(w)))];const hit=ws.filter(w=>txt.includes(w)),miss=ws.filter(w=>!txt.includes(w));$('#ats').innerHTML=ws.length?'<b>'+Math.round(hit.length/ws.length*100)+'% keyword match</b> ('+hit.length+'/'+ws.length+')<br>Missing: '+esc(miss.slice(0,25).join(', ')):''}
function ord(){$('#ord').innerHTML=D.order.map(k=>`<div class='dg' draggable='true' data-k2='${k}'><span>☰ <span>${NM[k]}</span></span><span><button onclick="mv('${k}',-1)">↑</button><button onclick="mv('${k}',1)">↓</button><button onclick="pbk('${k}')" aria-label="New page before ${NM[k]}" style="${(D.brk||[]).includes(k)?'background:#ffe4ec':''}">⏎</button></span></div>`).join('');let from;$('#ord').querySelectorAll('.dg').forEach(el=>{el.ondragstart=e=>{from=el.dataset.k2;e.dataTransfer.setData('text',from)};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const to=el.dataset.k2;if(!from||from==to)return;const a=D.order.filter(x=>x!=from);a.splice(a.indexOf(to),0,from);D.order=a;ord();draw();store()}})}

let Z=1;function zoom(d){Z=Math.min(1.5,Math.max(.5,Z+d));$('#zw').style.zoom=Z}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Voice input is not supported in this browser. Use Chrome.');return}

function expo(){const b=new Blob([JSON.stringify({_meta:{app:'OnlineResumeBuilder',version:2,exported:new Date().toISOString()},...D},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname()+'.json';a.click()}
function impo(i){const f=i.files[0];if(!f)return;f.text().then(async t=>{let j=JSON.parse(t);if(j.enc)j=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(j.iv)},await kdf($('#pw').value,ub(j.salt)),ub(j.data))));delete j._meta;D=Object.assign(blank(),j);fix();fill();store()}).catch(()=>alert('Invalid file, or wrong passphrase'))}

async function dbSave(){const n=$('#rn').value.trim();if(!n){$('#msg2').textContent='Enter a name first';return}try{const d=await db();d.transaction('r','readwrite').objectStore('r').put({n,d:JSON.stringify(D)}).onsuccess=()=>{$('#msg2').textContent='Saved “'+n+'”';dbList()}}catch(e){$('#msg2').textContent='IndexedDB unavailable'}}
async function dbList(){try{const d=await db();d.transaction('r').objectStore('r').getAllKeys().onsuccess=e=>{$('#rl').innerHTML=e.target.result.map(k=>`<div class='item'><b>${esc(k)}</b> <button data-k='${esc(k)}' onclick='dbLoad(this.dataset.k)'>Load</button> <button class='x' data-k='${esc(k)}' onclick='dbDel(this.dataset.k)'>Delete</button></div>`).join('')}}catch(e){}}

function wipe(){if(!confirm('Delete ALL data stored in this browser?'))return;['rb_data','rb_pii'].forEach(k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}});db().then(d=>{d.transaction('r','readwrite').objectStore('r').clear().onsuccess=dbList}).catch(()=>{});D=blank();fill();$('#msg').textContent='All stored data erased'}
dbList();
let WK=null;try{WK=new Worker(URL.createObjectURL(new Blob([`onmessage=e=>{const{jd,txt}=e.data,sw=new Set('the and for with that this are you our will from have has your not but can all any who was were been into their about more than such also may out use used using'.split(' '));const ws=[...new Set((jd.match(/[a-z][a-z+#.]{2,}/g)||[]).filter(w=>!sw.has(w)))];postMessage({ws,hit:ws.filter(w=>txt.includes(w))})}`])));WK.onerror=()=>{WK=null;ats0()}}catch(e){WK=null}
function ats(){if(!WK)return ats0();const txt=[D.title,D.summary,...D.skills,...[...D.exp,...D.edu,...D.proj].flatMap(Object.values)].join(' ').toLowerCase();WK.onmessage=e=>{const{ws,hit}=e.data,miss=ws.filter(w=>!hit.includes(w));$('#ats').innerHTML=ws.length?'<b>'+Math.round(hit.length/ws.length*100)+'% keyword match</b> ('+hit.length+'/'+ws.length+', Web Worker)<br>Missing: '+esc(miss.slice(0,25).join(', ')):''};WK.postMessage({jd:$('#jd').value.toLowerCase(),txt})}
function fname(){return $('#fn').value.trim().replace(/[^\w.-]+/g,'_')||(D.name||'resume').replace(/\s+/g,'_')}
async function kdf(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const b64=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encExp(){const pw=$('#pw').value;if(!pw||!window.crypto||!crypto.subtle){$('#msg2').textContent='Enter a passphrase first';return}const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pw,salt),new TextEncoder().encode(JSON.stringify(D))));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({enc:1,salt:b64(salt),iv:b64(iv),data:b64(ct)})],{type:'application/json'}));a.download=fname()+'_encrypted.json';a.click();$('#msg2').textContent='Encrypted with AES-GCM (PBKDF2). Keep the passphrase safe.'}
let PV=[];function patch(p,ch){if(PV.length!==ch.length||p.children.length!==ch.length){p.innerHTML=ch.map(c=>`<div class='vn'>${c}</div>`).join('')}else ch.forEach((c,i)=>{if(c!==PV[i])p.children[i].innerHTML=c});PV=ch}
const IO=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('on',e.isIntersecting)));

function gmDir(x,y){if(GM.over||(x==-GM.d[0]&&y==-GM.d[1]&&GM.s.length>1))return;GM.n=[x,y];GM.run=true}
function gmStep(){if(!GM.run)return;GM.d=GM.n;const h=[GM.s[0][0]+GM.d[0],GM.s[0][1]+GM.d[1]];if(h[0]<0||h[1]<0||h[0]>11||h[1]>11||GM.s.some(c=>c[0]==h[0]&&c[1]==h[1])){GM.run=false;GM.over=true;if(GM.sc>gmBest())gmBest(GM.sc);gmDraw();return}GM.s.unshift(h);if(h[0]==GM.f[0]&&h[1]==GM.f[1]){GM.sc++;GM.f=gmFood()}else GM.s.pop();gmDraw()}

let GI=0;
function gdShow(i){GI=Math.max(0,Math.min(GD.length-1,i));const l=Math.max(0,['en','ta','hi'].indexOf($('#lg').value)),g=GD[GI];$('#gdn').textContent='Step '+(GI+1)+' / '+GD.length;$('#gdt').textContent=g[0];$('#gdb').textContent=g[1+l];$('#gdd').innerHTML=GD.map((_,j)=>`<i style='width:8px;height:8px;border-radius:50%;background:${j==GI?'var(--ac)':'var(--bd)'}'></i>`).join('');$('#gdk').style.visibility=GI?'visible':'hidden';$('#gdx').textContent=GI==GD.length-1?'Start':'Next'}
function gdOpen(){$('#gd').style.display='grid';gdShow(0);$('#gdx').focus()}
function gdClose(){$('#gd').style.display='none';try{localStorage.setItem('rb_tour',1)}catch(e){}}
function gdGo(d){if(d>0&&GI==GD.length-1)return gdClose();gdShow(GI+d)}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#gd').style.display=='grid')gdClose()});
fill();snap();try{if(!localStorage.getItem('rb_tour'))gdOpen()}catch(e){}
</script></body></html>
